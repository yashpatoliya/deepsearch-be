version: '3.9'

services:
  # ── Deep Research Engine ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deep-research-engine
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-21600}
      PAGE_CACHE_TTL_SECONDS: ${PAGE_CACHE_TTL_SECONDS:-86400}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-15000}
      SCRAPER_MAX_URLS: ${SCRAPER_MAX_URLS:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - research-net
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deep-research-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - '6379:6379'
    restart: unless-stopped
    networks:
      - research-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data

networks:
  research-net:
    driver: bridge

volumes:
  redis-data:
